<body>
<div id="app">

  <!-- ============ 成长日历 ============ -->
  <section class="page active" id="page-calendar">
    <header class="topbar">
      <button class="bswitch" id="sw1">
        <span class="avatar sm" id="sw1Av">👶</span>
        <span class="bs-txt"><span class="nm" id="sw1Name">宝宝</span><span class="sub" id="sw1Age">—</span></span>
        <span class="caret">▾</span>
      </button>
      <div class="tb-actions">
        <button class="icon-btn" id="btnCal" aria-label="月历"></button>
        <button class="icon-btn" id="btnTip" aria-label="今日贴士"></button>
      </div>
    </header>

    <div class="subtabs" id="calSubtabs">
      <button class="on" data-v="feed">流水记录</button>
      <button data-v="agenda">日程视图</button>
    </div>

    <div class="datestrip" id="datestrip"></div>

    <!-- 秒表条（有计时时显示） -->
    <div class="timer-strip" id="timerStrip"></div>

    <div class="scroll" id="calScroll">
      <!-- 流水模式 -->
      <div id="feedView">
        <div class="summary" id="summary"></div>
        <div class="sec-title">当日流水 <span class="cnt" id="todayCnt"></span></div>
        <div class="timeline" id="timeline"></div>
      </div>
      <!-- 日程模式 -->
      <div id="agendaView" style="display:none">
        <div class="agenda-head">
          <button class="wk-nav" id="wkPrev">‹</button>
          <div class="wk-title" id="wkTitle"></div>
          <button class="wk-nav" id="wkNext">›</button>
        </div>
        <div class="weekbar" id="weekbar"></div>
        <div class="agenda-tools">
          <span class="ag-date" id="agDate"></span>
          <button class="mini-btn o" id="agAll">显示全部 24h</button>
        </div>
        <div class="agenda" id="agenda"></div>
      </div>
      <div class="pad-h"></div>
    </div>

    <div class="fab-bar">
      <div class="fab-strip" id="fabStrip"></div>
    </div>
  </section>

  <!-- ============ 成长记录 ============ -->
  <section class="page" id="page-growth">
    <header class="topbar simple">
      <div class="tt">成长记录</div>
      <button class="bswitch" id="sw2">
        <span class="avatar sm" id="sw2Av">👶</span>
        <span class="bs-txt"><span class="nm" id="sw2Name">宝宝</span></span>
        <span class="caret">▾</span>
      </button>
    </header>
    <div class="scroll" id="growthScroll">
      <div class="alert-card" id="alertCard" style="display:none"></div>

      <div class="metric-tabs" id="metricTabs"></div>
      <div class="chart-card hero">
        <div class="chart-head">
          <span id="chartTitle">体重曲线</span>
          <span class="legend">
            <span><i class="l-p50"></i>P50</span>
            <span><i class="l-band"></i>P3–P97</span>
            <span><i class="l-me"></i>宝宝</span>
          </span>
        </div>
        <div id="chartBox"></div>
        <div class="chart-note" id="chartNote"></div>
      </div>

      <div class="cur-card" id="curCard"></div>

      <div class="sec-title">测量记录 <span class="cnt" id="msrCnt"></span></div>
      <div class="measure-list" id="measureList"></div>

      <div class="sec-title">发育里程碑 <span class="cnt" id="mileCnt"></span></div>
      <div class="mile-groups" id="mileGroups"></div>
      <div class="sec-title">出牙记录 <span class="cnt" id="teethCnt"></span></div>
      <div class="teeth-box" id="teethBox"></div>
      <div class="pad-h"></div>
    </div>

    <!-- 变形悬浮按钮 -->
    <div class="fab-morph" id="fabMorph">
      <div class="fm-items" id="fmItems">
        <button data-t="measure"><span class="e">📏</span>一键测量</button>
        <button data-t="weight"><span class="e">⚖️</span>只记体重</button>
        <button data-t="length"><span class="e">📐</span>只记身长</button>
        <button data-t="tooth"><span class="e">🦷</span>出牙</button>
      </div>
      <button class="fm-main" id="fmMain"><span class="plus">＋</span></button>
    </div>
  </section>

  <!-- ============ 成长瞬间 ============ -->
  <section class="page" id="page-moments">
    <header class="topbar simple">
      <div class="tt">成长瞬间</div>
      <div class="tb-actions">
        <button class="icon-btn" id="btnMCal" aria-label="月历"></button>
        <button class="bswitch" id="sw4">
          <span class="avatar sm" id="sw4Av">👶</span>
          <span class="bs-txt"><span class="nm" id="sw4Name">宝宝</span></span>
          <span class="caret">▾</span>
        </button>
      </div>
    </header>
    <div class="scroll" id="momScroll">
      <div class="mom-date">
        <button class="icon-btn" id="momPrev">‹</button>
        <button class="md-mid" id="momToday"></button>
        <button class="icon-btn" id="momNext">›</button>
      </div>
      <div class="card daynote">
        <div class="dn-h">当日描述</div>
        <div id="dayNoteWrap"></div>
      </div>
      <div class="mom-bar">
        <span class="mb-t" id="momCount"></span>
        <span class="mb-r">
          <button class="mini-btn o" id="momSelect">选择</button>
          <button class="mini-btn g" id="momUpload">＋ 上传照片</button>
        </span>
      </div>
      <div class="mgrid" id="momGrid"></div>
      <div class="pad-h"></div>
    </div>
    <div class="mom-actions" id="momActions">
      <button class="ma-btn" id="maAll">全选</button>
      <button class="ma-btn primary" id="maDesc">批量描述</button>
      <button class="ma-btn danger" id="maDel">删除</button>
      <button class="ma-btn" id="maCancel">取消</button>
    </div>
  </section>

  <!-- ============ 个人中心 ============ -->
  <section class="page" id="page-me">
    <header class="topbar simple">
      <div class="tt">个人中心</div>
      <button class="bswitch" id="sw3">
        <span class="avatar sm" id="sw3Av">👶</span>
        <span class="bs-txt"><span class="nm" id="sw3Name">宝宝</span></span>
        <span class="caret">▾</span>
      </button>
    </header>
    <div class="scroll" id="meScroll">
      <div class="profile-card" id="profileCard"></div>

      <div class="fam-cta" id="famBox"></div>

      <div class="sec-title">疫苗接种 <span class="cnt" id="vacCnt"></span></div>
      <div class="vac-tabs" id="vacTabs"></div>
      <div class="vac-list" id="vacList"></div>

      <div class="sec-title">育儿知识库</div>
      <div class="know-filter" id="knowFilter"></div>
      <div class="know-list" id="knowList"></div>

      <div class="sec-title">数据</div>
      <div class="card data-box" id="dataBox"></div>
      <div class="pad-h"></div>
    </div>
  </section>

  <!-- ============ 底部导航 ============ -->
  <nav class="tabbar">
    <button class="tab active" data-page="page-calendar"><span></span>成长日历</button>
    <button class="tab" data-page="page-growth"><span></span>成长记录</button>
    <button class="tab" data-page="page-moments"><span></span>成长瞬间</button>
    <button class="tab" data-page="page-me"><span></span>个人中心</button>
  </nav>

  <!-- ============ 弹层 ============ -->
  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet"><div class="sheet-inner" id="sheetInner"></div></div>
  <div class="toast" id="toast"></div>
</div>

合作为第一口辅食。每次只添加一种新食物，观察 2–3 天无过敏再加下一种。"},{stage:[4,6],cat:"睡眠",title:"4–11 月每日睡眠 12–15 小时",body:"含 3–4 次小睡，夜间可连续睡 6–8 小时。开始建立固定的睡前程序（洗澡—喂奶—关灯），逐步减少奶睡、抱睡的入睡依赖。"},{stage:[4,6],cat:"发育",title:"4–6 月龄大运动节点",body:"4 月龄左右翻身（仰→俯），5 月龄扶坐，6 月龄独坐片刻、翻身自如。每天安排若干次俯卧练习（tummy time）有助于大运动发展。"},{stage:[4,6],cat:"安全",title:"出牙期与窒息防护",body:"4–10 月龄萌出第一颗牙，出牙期可用冷藏（非冷冻）牙胶缓解不适，出牙后即开始用指套牙刷清洁。此阶段手抓能力增强，家中不要留有直径 <3.5 cm 的小物件。"},{stage:[7,9],cat:"喂养",title:"7–9 月龄：末状食物 + 每日 600–800 ml 奶",body:"辅食每日 1–2 次，从泥糊过渡到稠粥、烂面、肉末、菜末。继续保证奶量，辅食不能替代奶。此阶段是锻炼咀嚼的关键窗口，不要长期停留在泥糊。"},{stage:[7,9],cat:"营养",title:"7–12 月龄铁推荐摄入 10 mg/日",body:"每周安排 1–2 次动物肝脏（每次约 10–15 g），搭配富含维生素 C 的蔬果提高铁吸收率。6–24 月龄是我国婴幼儿贫血的高发阶段。"},{stage:[7,9],cat:"安全",title:"1 岁内不加盐、不加糖、不喝蜂蜜",body:"蜂蜜可能含肉毒杆菌孢子，1 岁内婴儿肠道菌群未完善，有肉毒中毒风险。盐会加重肾脏负担并影响味觉发育。整颗坚果、果冻、大块硬水果 3 岁前不应提供。"},{stage:[7,9],cat:"发育",title:"8–9 月龄爬行与捏取",body:"8 月龄开始爬行，9 月龄能扶站、用拇指食指捏起小丸。提供安全的爬行空间，鼓励手抓食物（蒸软的胡萝卜条、香蕉块）锻炼咀嚼与手眼协调。"},{stage:[10,12],cat:"喂养",title:"10–12 月龄：碎块状食物 + 每日约 600 ml 奶",body:"辅食每日 2–3 次，逐步过渡到软饭、碎肉、碎菜，质地由细到粗。进餐固定餐次与座位，单次控制在 20–30 分钟，避免追喂与边玩边吃。"},{stage:[10,12],cat:"发育",title:"10–12 月龄语言与社交",body:"10 月龄会挥手再见、有意识叫爸爸妈妈；12 月龄能说 1–2 个词、用杯子喝水。多面对面说话、亲子共读，回应式互动比单向输入更有效。"},{stage:[10,12],cat:"安全",title:"学步期家居安全清单",body:"安装楼梯护栏、桌角防撞条、柜体固定防倾倒；热水瓶、清洁剂、药品上锁；插座加保护盖；婴儿床围栏加高。学步期是跌落与误服的高发期。"},{stage:[0,12],cat:"监测",title:"生长监测频率与测量规范",body:"6 月龄前每 1–2 个月测量一次，7–12 月龄每 2–3 个月一次。体重在空腹、排空大小便后测；身长取仰卧位双腿伸直；头围取眉弓上方至枕骨粗隆最大周径。看趋势（百分位曲线走向）比看单次数值更重要。"},{stage:[0,12],cat:"监测",title:"生长曲线的判读",body:"P3–P97 之间均属正常范围。真正需要警惕的是：曲线连续两次下滑跨越两条主要百分位线、体重持续低于 P3 或高于 P97、头围增长过快（>2 cm/月）或过慢。出现上述情况请到儿童保健科评估。"}],BG.ROLES=["妈妈","爸爸","爷爷","奶奶","外公","外婆","月嫂/育儿嫂","其他家人"];
